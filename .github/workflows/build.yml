name: 'Build'

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      httpbin:
        image: mccutchen/go-httpbin:2.25
        ports:
          - 8080:8080

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version-file: 'go.mod'
    - uses: zcong1993/setup-timezone@master
      with:
        timezone: Europe/Brussels
    - run: go get .
    - run: go build -v ./...
    - run: go test -v ./...
      env:
        API_URL: https://api-staging-eu.seatsio.net
        HTTPBIN_URL: http://127.0.0.1:8080
        DEMO_COMPANY_SECRET_KEY: ${{ secrets.DEMO_COMPANY_SECRET_KEY }}
        CORE_V2_STAGING_EU_SYSTEM_API_SECRET: ${{ secrets.CORE_V2_STAGING_EU_SYSTEM_API_SECRET }}
